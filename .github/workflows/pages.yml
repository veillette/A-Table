name: Deploy recipe site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  site:
    uses: ./.github/workflows/site-ci.yml
    with:
      output: dist
      runner: ubuntu-26.04
      node-version: '26'
      npm-ci: true
      check: npm run check
      browser-tests: npm run test:offline
